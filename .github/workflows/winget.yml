name: WinGet release validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-install:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download the published installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Invoke-WebRequest 'https://github.com/silviuk/Anthropic-Proxy-RS-Win/releases/download/windows-v1.5.0-1/Anthropic-Proxy-RS-Win-1.5.0-Setup.exe' -OutFile dist/Anthropic-Proxy-RS-Win-1.5.0-Setup.exe
          python packaging/create-winget.py dist/Anthropic-Proxy-RS-Win-1.5.0-Setup.exe
      - name: Prepare Microsoft's WinGet client
        shell: pwsh
        run: |
          $repair = -not (Get-Command winget -ErrorAction SilentlyContinue)
          if (-not $repair) { $repair = [version]((winget --version).Trim().TrimStart('v')) -lt [version]'1.28.0' }
          if ($repair) {
            Install-Module -Name Microsoft.WinGet.Client -Force -Repository PSGallery
            Repair-WinGetPackageManager -Force -Latest
          }
          winget --info
          winget settings --enable LocalManifestFiles
          if ($LASTEXITCODE -ne 0) { throw 'Cannot enable local package testing on this runner.' }
      - name: Validate the manifest
        timeout-minutes: 2
        shell: pwsh
        run: |
          winget validate --manifest dist/winget/1.5.0 --disable-interactivity
          if ($LASTEXITCODE -ne 0) { throw 'WinGet manifest validation failed.' }
      - name: Install the published package
        timeout-minutes: 4
        shell: pwsh
        run: |
          # This disposable runner tests the community package, not the Store catalog.
          winget source remove --name msstore --disable-interactivity
          winget install --manifest dist/winget/1.5.0 --silent --scope user --accept-package-agreements --accept-source-agreements --disable-interactivity --verbose-logs
          if ($LASTEXITCODE -ne 0) { throw 'WinGet package installation failed.' }
          $app = Join-Path $env:LOCALAPPDATA 'Programs/Anthropic-Proxy-RS-Win/anthropic-proxy.exe'
          & $app --version
          if ($LASTEXITCODE -ne 0) { throw 'Installed executable verification failed.' }
      - name: Remove the installed package
        timeout-minutes: 3
        shell: pwsh
        run: |
          winget uninstall --name Anthropic-Proxy-RS-Win --exact --silent --accept-source-agreements --disable-interactivity --verbose-logs
          if ($LASTEXITCODE -ne 0) { throw 'WinGet uninstall failed.' }
      - name: Collect diagnostics
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/diagnostics -Force | Out-Null
          $paths = @("$env:LOCALAPPDATA/Microsoft/WinGet/DiagOutputDir", "$env:LOCALAPPDATA/Packages/Microsoft.DesktopAppInstaller_8wekyb3d8bbwe/LocalState/DiagOutputDir")
          foreach ($path in $paths) {
            if (Test-Path $path) { Get-ChildItem $path -Filter '*.log' | Copy-Item -Destination dist/diagnostics -Force }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: winget-diagnostics
          path: dist/diagnostics/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: winget-manifests
          path: dist/winget/**
