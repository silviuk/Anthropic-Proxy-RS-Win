name: Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -C target-feature=+crt-static

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check
      - name: Check code
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run unit tests
        run: cargo test --locked
      - name: Build Windows x64 executable
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Test executable against a local upstream
        run: python scripts/smoke_test.py target/x86_64-pc-windows-msvc/release/anthropic-proxy.exe
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/package -Force
          Copy-Item target/x86_64-pc-windows-msvc/release/anthropic-proxy.exe dist/package/
          Copy-Item LICENSE, WINDOWS.md dist/package/
          Copy-Item .env.example dist/package/proxy.env.example
          Compress-Archive -Path dist/package/* -DestinationPath dist/anthropic-proxy-windows-x64.zip
          $hash = (Get-FileHash dist/anthropic-proxy-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  anthropic-proxy-windows-x64.zip" | Out-File dist/anthropic-proxy-windows-x64.zip.sha256 -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: anthropic-proxy-windows-x64
          path: |
            dist/anthropic-proxy-windows-x64.zip
            dist/anthropic-proxy-windows-x64.zip.sha256
