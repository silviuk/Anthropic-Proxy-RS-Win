name: Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -C target-feature=+crt-static

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Build native Windows settings window
        shell: pwsh
        run: ./windows/build.ps1
      - name: Check formatting
        run: cargo fmt --check
      - name: Check code
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run unit tests
        run: cargo test --locked
      - name: Build Windows x64 executable
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Test executable against a local upstream
        run: python scripts/smoke_test.py target/x86_64-pc-windows-msvc/release/anthropic-proxy.exe
      - name: Test settings, autostart, themes and log viewer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/ui-test -Force | Out-Null
          $binary = (Resolve-Path target/x86_64-pc-windows-msvc/release/anthropic-proxy.exe).Path
          $output = (Resolve-Path dist/ui-test).Path
          $test = Start-Process dist/package/Anthropic-Proxy-RS-Win.exe -ArgumentList @('--self-test', "`"$binary`"", "`"$output`"") -PassThru
          if (-not $test.WaitForExit(120000)) {
            Stop-Process -Id $test.Id -Force
            Get-Content dist/ui-test/desktop-test-progress.txt -ErrorAction SilentlyContinue
            throw 'Windows desktop tests timed out.'
          }
          if ($test.ExitCode -ne 0) {
            Get-Content dist/ui-test/desktop-test-error.txt -ErrorAction SilentlyContinue
            throw 'Windows desktop tests failed.'
          }
          Get-Content dist/ui-test/desktop-test-result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-ui-test-evidence
          path: dist/ui-test/*
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/package -Force
          Copy-Item target/x86_64-pc-windows-msvc/release/anthropic-proxy.exe dist/package/
          Copy-Item LICENSE, WINDOWS.md dist/package/
          Copy-Item .env.example dist/package/proxy.env.example
          Compress-Archive -Path dist/package/* -DestinationPath dist/anthropic-proxy-windows-x64.zip
          $hash = (Get-FileHash dist/anthropic-proxy-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  anthropic-proxy-windows-x64.zip" | Out-File dist/anthropic-proxy-windows-x64.zip.sha256 -Encoding ascii
      - name: Build installer with system light/dark appearance
        shell: pwsh
        run: ./packaging/build-installer.ps1
      - name: Verify installation and removal
        shell: pwsh
        run: ./packaging/test-installer.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installer-test-evidence
          path: dist/ui-test/installer-*
      - name: Installer checksum
        shell: pwsh
        run: |
          $file = Get-Item dist/*-Setup.exe
          $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($file.Name)" | Out-File "$($file.FullName).sha256" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: anthropic-proxy-windows-x64
          path: |
            dist/anthropic-proxy-windows-x64.zip
            dist/anthropic-proxy-windows-x64.zip.sha256
            dist/*-Setup.exe
            dist/*-Setup.exe.sha256
      - name: Build and validate MSIX Store package
        shell: pwsh
        run: ./packaging/msix/build.ps1
      - name: Test MSIX deployment and packaged runtime
        shell: powershell
        run: ./packaging/msix/test.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-msix-test-evidence
          path: dist/ui-test/msix-*
      - uses: actions/upload-artifact@v4
        with:
          name: store-msix-package
          path: dist/*.msix
